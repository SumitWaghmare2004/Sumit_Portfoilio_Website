<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="Contact_Form.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kit.fontawesome.com/721ad67aad.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Background Video -->
    <div class="video-container">
        <video autoplay loop muted playsinline id="bg-video">
            <source src="https://cdn.vecteezy.com/system/resources/previews/008/800/863/mp4_640_360_25fps.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div> <!-- Dark overlay for contrast -->
    </div>
    
<!-- Updated Contact Form with Icons -->
<div class="contact-wrapper">
    <div class="contact-container">
        <h2>Contact Me</h2>
        <form id="contactForm">
            <div class="input-box">
                <i class="fas fa-user"></i>
                <input type="text" id="name" required>
                <label>Name</label>
            </div>

            <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" required>
                <label>Email</label>
            </div>

            <div class="input-box">
                <i class="fas fa-comment"></i>
                <textarea id="message" rows="4" required></textarea>
                <label>Message</label>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </div>
</div>
<script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
        event.preventDefault();
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let message = document.getElementById("message").value.trim();

        if (name === "") {
            Swal.fire({
                icon: 'error',
                title: 'Validation Error',
                text: 'Name field cannot be empty!',
                confirmButtonText: 'OK'
            });
            return;
        }

        if (email === "") {
            Swal.fire({
                icon: 'error',
                title: 'Validation Error',
                text: 'Email field cannot be empty!',
                confirmButtonText: 'OK'
            });
            return;
        }

        if (!validateEmail(email)) {
            Swal.fire({
                icon: 'error',
                title: 'Validation Error',
                text: 'Please enter a valid email address!',
                confirmButtonText: 'OK'
            });
            return;
        }

        if (message === "") {
            Swal.fire({
                icon: 'error',
                title: 'Validation Error',
                text: 'Message field cannot be empty!',
                confirmButtonText: 'OK'
            });
            return;
        }

        Swal.fire({
            icon: 'success',
            title: 'Message Sent!',
            text: 'Thank you for reaching out. I will get back to you soon!',
            confirmButtonText: 'OK'
        });

        document.getElementById("contactForm").reset();
    });

    function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }
</script>
</body>
</html>
